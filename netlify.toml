[build]
  command = "npm run build"
  publish = "dist"

# 1. API 요청 (/api/*)은 공공데이터포털로 안전하게 중계하여 CORS 해결
[[redirects]]
  from = "/api/*"
  to = "https://apis.data.go.kr/:splat"
  status = 200
  force = true

# 2. Vue Router(SPA) 새로고침 시 404 에러 방지 설정
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200